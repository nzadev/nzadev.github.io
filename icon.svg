<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ff0077" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <g transform="translate(40, 40)">
    <polygon points="216,36 376,128 376,304 216,396 56,304 56,128" stroke="url(#primaryGrad)" stroke-width="6" fill="rgba(99, 102, 241, 0.06)" filter="url(#glow)" />
    
    <!-- Central NZA Emblem -->
    <path d="M128 300 V132 L216 252 V132" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M228 132 H304 L228 300 H304" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Corner Dots -->
    <circle cx="216" cy="36" r="6" fill="#00f0ff" />
    <circle cx="376" cy="128" r="6" fill="#6366f1" />
    <circle cx="376" cy="304" r="6" fill="#ff0077" />
    <circle cx="216" cy="396" r="6" fill="#00f0ff" />
    <circle cx="56" cy="304" r="6" fill="#ff0077" />
    <circle cx="56" cy="128" r="6" fill="#6366f1" />
  </g>
</svg>
